<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CICADAS</title>

    <link rel="stylesheet" href="styles/main.css">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>

<header class="header">
    <h1>CICADAS</h1>
    <p>Análisis acústico de cigarras</p>
</header>


<main class="container">

    <section class="controls">

        <h2>Audio</h2>

        <div class="control-group">
            <label for="audioFile">Cargar archivo de audio</label>
            <input
                    type="file"
                    id="audioFile"
                    accept="audio/*"
            >
        </div>

        <div class="control-group">
            <button id="recordButton" aria-pressed="false">
                <span class="record-icon" aria-hidden="true">🎙</span>
                <span id="recordButtonText">Grabar</span>
            </button>
            <p id="recordStatus" class="record-status" aria-live="polite"></p>
        </div>

    </section>


    <section class="audio-info">

        <h2>Información</h2>

        <div id="audioInfo">
            <p>No se ha cargado ningún audio.</p>
        </div>

        <div id="loading" class="loading hidden" aria-live="polite">

            <div class="loading-header">
                <p id="loadingText">Procesando audio...</p>
                <span id="loadingPercent" class="loading-percent">0%</span>
            </div>

            <div
                    class="loading-bar"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    id="loadingBar"
            >
                <div id="loadingProgress" class="loading-progress"></div>
            </div>

            <p id="loadingStage" class="loading-stage">Iniciando…</p>

        </div>

    </section>


    <section class="plot-section">

        <h2>Forma de onda</h2>

        <div id="waveform" class="plot-container"></div>

    </section>


    <section class="plot-section">

        <h2>Espectro</h2>

        <div id="spectrum" class="plot-container"></div>

    </section>


    <section class="plot-section">

        <h2>Sonograma</h2>

        <div id="spectrogram" class="plot-container"></div>

    </section>

</main>


<script type="module" src="src/app.js"></script>

</body>
</html>
